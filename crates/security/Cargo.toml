[package]
name = "spin-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
spin-domain = { path = "../domain" }
hop-auth.workspace = true
# 30-09-2026: bestaande enc:v1-state heeft AES-256-GCM met 32-byte sleutels.
# Lean biedt alleen AES-128-GCM. Deze gepinde no_std-crate bewaart het formaat;
# alloc staat uit en de aanroeper reserveert iedere buffer faalbaar.
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "zeroize"] }

aes = { version = "=0.8.4", default-features = false, features = ["zeroize"] }
zeroize = { version = "=1.9.0", default-features = false }

[lints]
workspace = true
